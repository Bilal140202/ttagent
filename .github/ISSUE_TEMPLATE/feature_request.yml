name: Feature request
description: Propose a change without breaking the non-negotiables
labels: [enhancement]
body:
  - type: checkboxes
    id: constraints
    attributes:
      label: Non-negotiables your proposal preserves
      options:
        - label: "No login / no cookies / no browser"
        - label: "stdlib-only single file (Python 3.9+)"
        - label: "No LLM at runtime — deterministic pipeline"
        - label: "Fail-closed honesty (explicit nulls, structured errors) preserved"
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal, description: What and why. If it adds a decode slot, say which dead slot it replaces.}
    validations: {required: true}
