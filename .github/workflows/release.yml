name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Package sync + version consistency
        run: |
          python scripts/sync_package.py --check
          python - <<'PY'
          import re, tomllib
          tool = open("ttagent.py").read()
          v_tool = re.search(r'^__version__\s*=\s*"([^"]+)"', tool, re.M).group(1)
          v_proj = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert v_tool == v_proj, (v_tool, v_proj)
          print("version consistency OK:", v_tool)
          PY
      - name: Offline test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - name: Clean-venv smoke (wheel)
        run: |
          python -m venv clean && clean/bin/pip install dist/*.whl
          clean/bin/ttagent --version
          clean/bin/python -m ttagent --version 2>/dev/null || \
            clean/bin/python -c "import ttagent; print(ttagent.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
